<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#377d76">
<title>مترجمي عربي - إندونيسي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f8f7;font-family:Arial,sans-serif;color:#203a38}
.app{max-width:720px;margin:auto;padding:22px}
.hero{background:#377d76;color:white;border-radius:40px;padding:35px 20px;text-align:center;margin-bottom:25px}
.hero h1{font-size:38px;margin:0 0 12px}
.hero p{font-size:20px;margin:0}
.switch{background:white;border-radius:30px;padding:20px;display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:bold;margin-bottom:25px}
#swap{border:0;background:#e5f1ef;border-radius:22px;padding:18px 28px;font-size:25px;color:#377d76}
.box{background:white;border-radius:30px;padding:20px;margin-bottom:20px}
textarea{width:100%;height:180px;border:0;outline:0;font-size:22px;resize:none;font-family:Arial;text-align:right}
.main{width:100%;border:0;background:#377d76;color:white;border-radius:25px;padding:24px;font-size:28px;font-weight:bold}
.small{margin:18px 5px;text-align:center;color:#607875;font-size:17px}
#result{display:none}
.card{background:white;border-radius:25px;padding:20px;margin-top:15px}
.title{font-size:22px;font-weight:bold;margin-bottom:12px;color:#377d76}
.word{display:inline-block;background:#edf5f3;padding:8px 12px;border-radius:12px;margin:4px;font-size:18px}
.error{color:#b33}
</style>
</head>

<body>
<div class="app">

<section class="hero">
<h1>مترجمي 🇸🇦 ↔ 🇮🇩</h1>
<p>ترجمة + معنى كل كلمة + شرح القاعدة</p>
</section>

<div class="switch">
<b id="from">العربية</b>
<button id="swap">⇄</button>
<b id="to">Bahasa Indonesia</b>
</div>

<div class="box">
<textarea id="input" placeholder="اكتب الجملة بالعربية..."></textarea>
</div>

<button class="main" id="go">ترجمة</button>

<div id="status" class="small"></div>
<div id="result"></div>

</div>

<script>
let arToId=true;

const input=document.getElementById("input");
const result=document.getElementById("result");
const status=document.getElementById("status");
const from=document.getElementById("from");
const to=document.getElementById("to");

document.getElementById("swap").onclick=()=>{
 arToId=!arToId;
 from.textContent=arToId?"العربية":"Bahasa Indonesia";
 to.textContent=arToId?"Bahasa Indonesia":"العربية";
 input.placeholder=arToId?"اكتب الجملة بالعربية...":"Tulis kalimat dalam bahasa Indonesia...";
 input.value="";
 result.style.display="none";
};

async function translateText(text,sl,tl){
 const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+sl+"&tl="+tl+"&dt=t&q="+encodeURIComponent(text);
 const r=await fetch(url);
 if(!r.ok) throw new Error("translation error");
 const x=await r.json();
 return x[0].map(a=>a[0]).join("");
}

async function translate(){
 const text=input.value.trim();
 if(!text){
  status.textContent="اكتب جملة أولًا";
  return;
 }

 status.textContent="جارٍ الترجمة...";
 result.style.display="none";

 try{
  const sl=arToId?"ar":"id";
  const tl=arToId?"id":"ar";

  const translated=await translateText(text,sl,tl);

  const words=translated
    .replace(/[.,!?،؛:()[\]"']/g," ")
    .split(/\s+/)
    .filter(Boolean);

  let html="";
  html+="<div class='card'>";
  html+="<div class='title'>الترجمة</div>";
  html+="<div style='font-size:25px;line-height:1.7'>"+translated+"</div>";
  html+="</div>";

  html+="<div class='card'>";
  html+="<div class='title'>معنى الكلمات</div>";
  html+="<div id='words'>جارٍ استخراج معنى الكلمات...</div>";
  html+="</div>";

  html+="<div class='card'>";
  html+="<div class='title'>شرح القاعدة</div>";
  if(arToId){
   html+="<div style='font-size:19px;line-height:1.7'>في اللغة الإندونيسية غالبًا يأتي الفاعل قبل الفعل، ولا تتغير الأفعال حسب الزمن مثل العربية. يتم التعبير عن الزمن غالبًا بكلمات مثل <b>sudah</b> للماضي و<b>akan</b> للمستقبل و<b>sedang</b> للحدث الجاري.</div>";
  }else{
   html+="<div style='font-size:19px;line-height:1.7'>في هذه الجملة نترجم المعنى إلى العربية مع مراعاة ترتيب الكلمات والمعنى المقصود في اللغة الإندونيسية.</div>";
  }
  html+="</div>";

  result.innerHTML=html;
  result.style.display="block";

  const wordBox=document.getElementById("words");
  let out="";

  for(const w of words.slice(0,12)){
   try{
    const meaning=await translateText(w,tl,sl);
    out+="<span class='word'><b>"+w+"</b> = "+meaning+"</span>";
   }catch(e){
    out+="<span class='word'>"+w+"</span>";
   }
  }

  wordBox.innerHTML=out;

  status.textContent="تمت الترجمة ✓";

 }catch(e){
  status.innerHTML="<span class='error'>حدث خطأ. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.</span>";
 }
}

document.getElementById("go").onclick=translate;
</script>
</body>
</html>
